<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLIDX - Videollamada</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Jitsi -->
  <script src="https://8x8.vc/external_api.js"></script>

  <!-- MediaPipe: libs JS clásicas (globales) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5/holistic.js" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <img src="logo_universidad.png" alt="Logo Universidad" class="logo" />
    <div class="header-center">
      <h1>SOLIDX</h1>
      <p>"La inclusión no es llevar las personas a lo que ya existe; es crear nuevos y mejores espacios para todos"</p>
    </div>
  </header>

  <main>
    <div class="join-container">
      <div class="row">
        <input id="nombre" type="text" placeholder="Tu nombre" />
        <input id="sala" type="text" placeholder="Nombre de la sala" />
      </div>

      <div class="role-card">
        <div class="role-title">¿Cuál es tu rol para esta reunión?</div>
        <label class="role-option">
          <input type="radio" name="rol" id="rolOyente" value="oyente" checked />
          <span>Soy oyente</span>
        </label>
        <label class="role-option">
          <input type="radio" name="rol" id="rolNoOyente" value="no_oyente" />
          <span>No oyente (activar traductor)</span>
        </label>
      </div>

      <div class="actions">
        <button id="btnEntrar">Entrar</button>
        <button id="btnInvitar" class="secondary">Invitar</button>
      </div>
    </div>

    <!-- Recuadro central de Jitsi, con overlay de keypoints encima -->
    <div id="meet" class="meet">
      <div id="accessibility-overlay" class="access-overlay">
        <!-- Video oculto: solo fuente para MediaPipe -->
        <video id="accessibleVideo" autoplay playsinline muted></video>
        <!-- Canvas transparente donde dibujamos los puntos -->
        <canvas id="overlayCanvas"></canvas>
        <div class="access-label">Modo accesible activo</div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 SOLIDX — Videollamadas con IA</p>
  </footer>

  <script>
    const APP_ID = "vpaas-magic-cookie-47b629c2cf8a4db3a9373961402974c0";
    const domain = "8x8.vc";

    // Aliases para las globals de MediaPipe
    const mpHolistic = window;   // Holistic y constantes cuelgan de window
    const drawingUtils = window; // drawLandmarks, drawConnectors
    // Camera viene global desde camera_utils.js

    // Referencias para la vista accesible
    const overlayContainer = document.getElementById("accessibility-overlay");
    const accessVideo = document.getElementById("accessibleVideo");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const overlayCtx = overlayCanvas.getContext("2d");

    let accessStream = null;      // MediaStream de la cámara
    let holistic = null;          // Instancia de mpHolistic.Holistic
    let camera = null;            // Instancia de Camera (camera_utils)
    let accessibilityEnabled = false;

    // Lee ?room= de la URL y autocompleta
    const params = new URLSearchParams(window.location.search);
    const roomFromUrl = params.get("room");
    if (roomFromUrl) {
      document.getElementById("sala").value = roomFromUrl;
    }

    // Botón Invitar
    document.getElementById("btnInvitar").addEventListener("click", async () => {
      const salaInput = document.getElementById("sala").value.trim() || "demo";
      const origin = window.location.origin;
      const inviteUrl = `${origin}/join/${encodeURIComponent(salaInput)}`;

      try {
        await navigator.clipboard.writeText(inviteUrl);
        alert("Link de invitación copiado:\n" + inviteUrl);
      } catch {
        prompt("Copia el enlace y compártelo:", inviteUrl);
      }
    });

    // Botón Entrar
    document.getElementById("btnEntrar").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value.trim() || "Invitado";
      const salaInput = document.getElementById("sala").value.trim() || "demo";
      const roomName = `${APP_ID}/${salaInput}`;

      const esNoOyente = document.getElementById("rolNoOyente").checked;
      const traductorInicialActivo = esNoOyente;

      try {
        const res = await fetch(`/api/token?room=${encodeURIComponent(salaInput)}&name=${encodeURIComponent(nombre)}&moderator=true`);
        const data = await res.json();

        if (!data.token) {
          alert("No se pudo obtener el token del servidor.");
          return;
        }

        // Config base para Jitsi (mantengo fullscreen y toda la toolbar por defecto)
        const configOverwrite = {
          prejoinPageEnabled: true,
          defaultLanguage: "es",
          disableSimulcast: true,
          constraints: { video: { height: { ideal: 480 }, width: { ideal: 720 } } },
        };

        const interfaceConfigOverwrite = {
          SHOW_JITSI_WATERMARK: false,
          SHOW_CHROME_EXTENSION_BANNER: false,
          DEFAULT_BACKGROUND: "#f0f0f0"
          // No tocamos TOOLBAR_BUTTONS => Jitsi mantiene fullscreen, chat, etc.
        };

        const options = {
          roomName,
          jwt: data.token,
          parentNode: document.getElementById("meet"),
          configOverwrite,
          interfaceConfigOverwrite,
          userInfo: { displayName: nombre }
        };

        const api = new JitsiMeetExternalAPI(domain, options);
        api.executeCommand("subject", "Videollamada SOLIDX");

        // Solo activamos el modo accesible DESPUÉS de entrar a la sala
        api.addListener("videoConferenceJoined", () => {
          if (traductorInicialActivo) {
            startAccessibility();
          }
        });

        // Cuando la sala se cierra, apagamos cámara y MediaPipe
        api.addListener("readyToClose", () => {
          stopAccessibility();
        });

      } catch (err) {
        console.error("Error al conectar con el servidor:", err);
        alert("Error al conectar con el servidor. Revisa la consola.");
      }
    });

    // =========================
    //   ACCESIBILIDAD / MEDIAPIPE
    // =========================

    async function startAccessibility() {
      if (accessibilityEnabled) return;
      accessibilityEnabled = true;

      overlayContainer.style.display = "flex";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Este navegador no soporta getUserMedia");
        }

        // Pedimos acceso a la cámara (se puede compartir con Jitsi)
        accessStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 }
        });
        accessVideo.srcObject = accessStream;

        // Ajustamos el canvas al tamaño del recuadro de Jitsi
        const meetElem = document.getElementById("meet");
        const resizeCanvasToMeet = () => {
          overlayCanvas.width = meetElem.clientWidth;
          overlayCanvas.height = meetElem.clientHeight;
        };
        resizeCanvasToMeet();
        window.addEventListener("resize", resizeCanvasToMeet);

        initHolistic(accessVideo, overlayCanvas, overlayCtx);

      } catch (e) {
        console.error("Error al iniciar accesibilidad:", e.name, e.message);
        alert(
          "No se pudo acceder a la cámara para la vista accesible.\n\n" +
          "Detalle técnico: " + e.name + (e.message ? " - " + e.message : "")
        );
        accessibilityEnabled = false;
        overlayContainer.style.display = "none";
      }
    }

    function stopAccessibility() {
      if (!accessibilityEnabled) return;
      accessibilityEnabled = false;

      overlayContainer.style.display = "none";

      // Cortar stream de cámara
      if (accessStream) {
        accessStream.getTracks().forEach(t => t.stop());
        accessStream = null;
      }

      // Detener cámara de MediaPipe
      if (camera) {
        camera.stop();
        camera = null;
      }

      // Limpiar canvas
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    // Espeja landmarks en X para que coincidan con la vista espejada de Jitsi
    function mirrorLandmarks(landmarks) {
      if (!landmarks) return null;
      return landmarks.map(l => ({
        ...l,
        x: 1 - l.x   // coord normalizada [0,1] → espejo horizontal
      }));
    }

    function initHolistic(videoEl, canvasEl, ctx) {
      // Creamos Holistic una sola vez
      if (!holistic) {
        holistic = new mpHolistic.Holistic({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5/${file}`,
        });

        holistic.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          enableSegmentation: false,
          refineFaceLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });

        holistic.onResults((results) => {
          ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

          // Solo puntos, sin dibujar la imagen → se ve el video de Jitsi de fondo
          const landmarkStyle = {
            color: '#00ff00',
            radius: 2
          };

          // Espejamos para que mano derecha se vea como derecha en la vista de Jitsi
          const poseLms      = mirrorLandmarks(results.poseLandmarks);
          const leftHandLms  = mirrorLandmarks(results.leftHandLandmarks);
          const rightHandLms = mirrorLandmarks(results.rightHandLandmarks);
          // Si quisieras cara: const faceLms = mirrorLandmarks(results.faceLandmarks);

          if (poseLms) {
            drawingUtils.drawLandmarks(ctx, poseLms, landmarkStyle);
          }
          if (leftHandLms) {
            drawingUtils.drawLandmarks(ctx, leftHandLms, landmarkStyle);
          }
          if (rightHandLms) {
            drawingUtils.drawLandmarks(ctx, rightHandLms, landmarkStyle);
          }
          // Cara desactivada por ahora
          // if (faceLms) { drawingUtils.drawLandmarks(ctx, faceLms, landmarkStyle); }
        });
      }

      // Camera viene de camera_utils.js
      camera = new Camera(videoEl, {
        onFrame: async () => {
          await holistic.send({ image: videoEl });
        },
        width: 640,
        height: 480,
      });

      camera.start();
    }
  </script>
</body>
</html>
